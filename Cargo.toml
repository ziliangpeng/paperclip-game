[package]
name = "paperclip-game"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "paperclip_game"
path = "src/lib.rs"

[[bin]]
name = "paperclip-game"
path = "src/main.rs"

[dependencies]
axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
getrandom = { version = "0.4.3", features = ["std"] }
num-bigint = "0.5.1"
rand_chacha = "0.10.0"
rand_core = "0.10.1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
serde_json = "1"
