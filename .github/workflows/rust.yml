name: Rust and public validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: Stable Rust, public hygiene, and planning guards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_TERM_COLOR: never
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select stable Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Install stable Rust components
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Record actual tool versions
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
          python3 --version

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Check all targets against the committed lockfile
        run: cargo check --locked --all-targets

      - name: Lint all Rust targets against the committed lockfile
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test all Rust targets against the committed lockfile
        run: cargo test --locked --all-targets

      - name: Build locked library and binary
        run: cargo build --locked

      - name: Check real bootstrap process contracts
        run: |
          set -e
          expected_not_initialized='paperclip-game: not-yet-initialized: gameplay runtime and HTTP service are not implemented'
          expected_forbidden='paperclip-game: configuration error: unknown or forbidden argument; only --listen-addr and --database-path are supported'
          expected_invalid_listener='paperclip-game: configuration error: invalid value for --listen-addr; expected a numeric IP address and port'
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          sentinel_dir="$(mktemp -d)"
          sentinel_db="$sentinel_dir/bootstrap-sentinel.sqlite3"
          trap 'rm -f "$stdout_file" "$stderr_file" "$sentinel_db"; rmdir "$sentinel_dir"' EXIT
          printf '%s' 'original-database-bytes' > "$sentinel_db"
          sentinel_before="$(cksum "$sentinel_db")"

          capture_process() {
            set +e
            timeout 10s target/debug/paperclip-game "$@" > "$stdout_file" 2> "$stderr_file"
            captured_status=$?
            set -e
          }

          test ! -e data/paperclip.sqlite3
          test ! -e data/bootstrap-smoke.sqlite3
          capture_process
          test "$captured_status" -eq 1
          test ! -s "$stdout_file"
          test "$(cat "$stderr_file")" = "$expected_not_initialized"
          test ! -e data/paperclip.sqlite3

          capture_process --listen-addr 127.0.0.1:3100 --database-path data/bootstrap-smoke.sqlite3
          test "$captured_status" -eq 1
          test ! -s "$stdout_file"
          test "$(cat "$stderr_file")" = "$expected_not_initialized"
          test ! -e data/bootstrap-smoke.sqlite3

          capture_process --database-path "$sentinel_db" --pause 1
          test "$captured_status" -eq 2
          test ! -s "$stdout_file"
          test "$(cat "$stderr_file")" = "$expected_forbidden"
          test "$(cksum "$sentinel_db")" = "$sentinel_before"
          test ! -e "${sentinel_db}-journal"
          test ! -e "${sentinel_db}-shm"
          test ! -e "${sentinel_db}-wal"

          capture_process --listen-addr do-not-echo-this-ci-value
          test "$captured_status" -eq 2
          test ! -s "$stdout_file"
          test "$(cat "$stderr_file")" = "$expected_invalid_listener"
          test ! -e data/paperclip.sqlite3
          test ! -e data/bootstrap-smoke.sqlite3

      - name: Validate public repository hygiene
        run: python3 -B scripts/check_public_hygiene.py

      - name: Validate canonical inventory without private captures
        run: python3 -B scripts/validate_inventory.py requirements/data/gameplay-inventory.json

      - name: Validate the complete execution plan
        run: python3 -B scripts/validate_execution_plan.py requirements/data/execution-plan.json

      - name: Prove that plan guard mutations fail
        run: python3 -B scripts/validate_execution_plan.py requirements/data/execution-plan.json --self-test
