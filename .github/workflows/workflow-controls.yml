name: Workflow and scanner controls

# Keep mutation fixtures scoped to changes in the four CI control files.
on:
  pull_request:
    paths:
      - .github/workflows/rust.yml
      - .github/workflows/workflow-controls.yml
      - scripts/check_rust_workflow.py
      - scripts/check_public_hygiene.py
  push:
    branches:
      - main
    paths:
      - .github/workflows/rust.yml
      - .github/workflows/workflow-controls.yml
      - scripts/check_rust_workflow.py
      - scripts/check_public_hygiene.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    name: Workflow and public hygiene self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Select stable Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Record actual Python version
        run: python3 --version

      - name: Check the native Rust workflow contract
        run: python3 -B scripts/check_rust_workflow.py --workflow .github/workflows/rust.yml

      - name: Prove workflow contract mutations fail
        run: python3 -B scripts/check_rust_workflow.py --self-test

      - name: Validate current public repository hygiene
        run: python3 -B scripts/check_public_hygiene.py

      - name: Prove public hygiene mutations fail
        run: python3 -B scripts/check_public_hygiene.py --self-test
